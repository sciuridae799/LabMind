spring:
  datasource:
    url: ${SUPER_AGENT_MYSQL_URL}
    username: ${SUPER_AGENT_MYSQL_USERNAME}
    password: ${SUPER_AGENT_MYSQL_PASSWORD}
    driver-class-name: ${SUPER_AGENT_MYSQL_DRIVER_CLASS_NAME}
  data:
    redis:
      host: ${SUPER_AGENT_REDIS_HOST}
      port: ${SUPER_AGENT_REDIS_PORT}
      password: ${SUPER_AGENT_REDIS_PASSWORD}
      database: ${SUPER_AGENT_REDIS_DATABASE}
  kafka:
    bootstrap-servers: ${SUPER_AGENT_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: super-agent-business-chat
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
  ai:
    dashscope:
      # Shared by the chat and embedding model chain.
      api-key: ${ALI_BAI_LIAN_API_KEY}
      chat:
        options:
          model: qwen-plus-latest
    alibaba:
      toolcalling:
        tavilysearch:
          api-key: ${TAVILY_API_KEY}
  redis:
    redisson:
      protocol: redis
      local-lock-cache-ttl: 30s
super-agent:
  chat:
    model-api-config:
      api-key-aes-key-base64: ${SUPER_AGENT_MODEL_API_CONFIG_AES_KEY_BASE64}
  kafka:
    topics:
      document-parse-requested: ${SUPER_AGENT_KAFKA_TOPIC_DOCUMENT_PARSE_REQUESTED:super-agent.document.parse.requested}
  knowledge:
    neo4j:
      uri: ${SUPER_AGENT_NEO4J_URI}
      username: ${SUPER_AGENT_NEO4J_USERNAME}
      password: ${SUPER_AGENT_NEO4J_PASSWORD}
      database: ${SUPER_AGENT_NEO4J_DATABASE}
    document-storage:
      endpoint: ${SUPER_AGENT_MINIO_ENDPOINT}
      access-key: ${SUPER_AGENT_MINIO_ACCESS_KEY}
      secret-key: ${SUPER_AGENT_MINIO_SECRET_KEY}
      bucket: ${SUPER_AGENT_MINIO_BUCKET}
